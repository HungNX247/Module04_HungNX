<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Quản lý lịch hẹn')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <div class="page-header d-flex justify-content-between align-items-center">
    <div>
      <h2 class="fw-bold mb-1">Quản lý lịch hẹn</h2>
      <p class="text-muted mb-0">Trang dành cho quản trị viên</p>
    </div>
    <a th:href="@{/admin/appointments/create}" class="btn btn-primary">Tạo lịch hẹn</a>
  </div>

  <div th:replace="~{fragments/flash :: flash}"></div>

  <div class="card card-clean">
    <div class="card-body p-0">
      <div th:if="${#lists.isEmpty(appointments)}" class="p-4 text-center text-muted">
        Chưa có dữ liệu lịch hẹn.
      </div>

      <div class="table-responsive" th:if="${!#lists.isEmpty(appointments)}">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Bệnh nhân</th>
            <th>SĐT</th>
            <th>Bác sĩ</th>
            <th>Chuyên khoa</th>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Trạng thái</th>
            <th>Ghi chú</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="item : ${appointments}">
            <td th:text="${item.id}">1</td>
            <td th:text="${item.patient.fullName}">Nguyễn Văn A</td>
            <td th:text="${item.patient.phone}">0901234567</td>
            <td th:text="${item.doctor.fullName}">BS. B</td>
            <td th:text="${item.doctor.specialty.name}">Tai Mũi Họng</td>
            <td th:text="${item.appointmentDate}">2026-04-12</td>
            <td th:text="${item.appointmentTime}">14:00</td>
            <td>
                            <span class="badge rounded-pill"
                                  th:classappend="${item.status.name() == 'BOOKED'} ? ' text-bg-success' :
                                                  (${item.status.name() == 'CANCELED'} ? ' text-bg-danger' : ' text-bg-secondary')"
                                  th:text="${item.status}">
                            </span>
            </td>
            <td th:text="${item.note ?: '-'}">Admin tạo hộ</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
