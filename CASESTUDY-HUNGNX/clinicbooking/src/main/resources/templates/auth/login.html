<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng nhập')}"></head>
<body class="auth-page">
<div class="container">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <h2 class="fw-bold">Đăng nhập</h2>
        <p class="text-muted mb-0">Clinic Booking System</p>
      </div>

      <div th:if="${param.error}" class="alert alert-danger">
        Sai số điện thoại hoặc mật khẩu.
      </div>

      <div th:if="${param.logout}" class="alert alert-success">
        Bạn đã đăng xuất thành công.
      </div>

      <div th:if="${param.registered}" class="alert alert-success">
        Đăng ký thành công. Bạn có thể đăng nhập ngay.
      </div>

      <div th:if="${param.passwordChanged}" class="alert alert-success">
        Đổi mật khẩu thành công. Vui lòng đăng nhập lại.
      </div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label">Số điện thoại</label>
          <input type="text" name="phone" class="form-control" placeholder="0901234567">
        </div>

        <div class="mb-4">
          <label class="form-label">Mật khẩu</label>
          <input type="password" name="password" class="form-control" placeholder="******">
        </div>

        <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
      </form>

      <div class="text-center mt-3">
        <span class="text-muted">Chưa có tài khoản?</span>
        <a th:href="@{/register}" class="fw-semibold text-decoration-none">Đăng ký</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
