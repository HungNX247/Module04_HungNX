<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng ký')}"></head>
<body class="auth-page">
<div class="container">
    <div class="auth-wrapper">
        <div class="auth-card auth-card-lg">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Tạo tài khoản</h2>
                <p class="text-muted mb-0">Đăng ký tài khoản bệnh nhân</p>
            </div>

            <form th:action="@{/register}" th:object="${registerForm}" method="post">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Họ tên</label>
                    <input th:field="*{fullName}" class="form-control">
                    <div class="invalid-feedback d-block"
                         th:if="${#fields.hasErrors('fullName')}"
                         th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Số điện thoại</label>
                    <input th:field="*{phone}" class="form-control">
                    <div class="invalid-feedback d-block"
                         th:if="${#fields.hasErrors('phone')}"
                         th:errors="*{phone}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input th:field="*{password}" type="password" class="form-control">
                    <div class="invalid-feedback d-block"
                         th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Nhập lại mật khẩu</label>
                    <input th:field="*{confirmPassword}" type="password" class="form-control">
                    <div class="invalid-feedback d-block"
                         th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted">Đã có tài khoản?</span>
                <a th:href="@{/login}" class="fw-semibold text-decoration-none">Đăng nhập</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
