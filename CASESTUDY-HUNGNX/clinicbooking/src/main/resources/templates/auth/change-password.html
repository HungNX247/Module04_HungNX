<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đổi mật khẩu')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <div class="page-header">
    <h2 class="fw-bold mb-1">Đổi mật khẩu</h2>
    <p class="text-muted mb-0">Cập nhật mật khẩu tài khoản của bạn</p>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card card-clean">
        <div class="card-body p-4">
          <form th:action="@{/change-password}" th:object="${changePasswordForm}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
              <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
            </div>

            <div class="mb-3">
              <label class="form-label">Mật khẩu hiện tại</label>
              <input th:field="*{currentPassword}" type="password" class="form-control">
              <div class="invalid-feedback d-block"
                   th:if="${#fields.hasErrors('currentPassword')}"
                   th:errors="*{currentPassword}"></div>
            </div>

            <div class="mb-3">
              <label class="form-label">Mật khẩu mới</label>
              <input th:field="*{newPassword}" type="password" class="form-control">
              <div class="invalid-feedback d-block"
                   th:if="${#fields.hasErrors('newPassword')}"
                   th:errors="*{newPassword}"></div>
            </div>

            <div class="mb-4">
              <label class="form-label">Nhập lại mật khẩu mới</label>
              <input th:field="*{confirmPassword}" type="password" class="form-control">
              <div class="invalid-feedback d-block"
                   th:if="${#fields.hasErrors('confirmPassword')}"
                   th:errors="*{confirmPassword}"></div>
            </div>

            <div class="d-flex gap-2">
              <a th:href="@{/}" class="btn btn-outline-secondary">Quay lại</a>
              <button type="submit" class="btn btn-primary">Đổi mật khẩu</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
